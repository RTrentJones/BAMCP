version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images (Dockerfile, Dockerfile.dev) are pinned by digest — this keeps the digests and
  # tags moving so the pin never turns into a stale, unpatched base.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
