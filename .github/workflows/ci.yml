name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reproducible-build gate: the lockfile must be fresh, and the PINNED environment must
  # install and pass the ship-gate (test + eval-smoke). The 3.10-3.12 `test` matrix below
  # deliberately installs broad ranges — that is the compat check; this is the pinned one.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Install from the frozen lock
        run: uv sync --frozen --extra dev --extra eval --extra telemetry
      # The bundled viewer is part of the ship-gate (test_resources asserts the built bundle),
      # so build it here just as `make install` does for the other jobs.
      - name: Build the viewer bundle
        run: make build-viewer
      - name: Deterministic fixtures + ship-gate from the pinned env
        run: |
          uv run python tests/create_fixtures.py
          uv run python -m pytest tests/ --ignore=tests/e2e -q
          uv run make eval-smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: make lint
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - name: Install telemetry + eval extras
        # The 85% strict coverage gate needs the OTel SDK (telemetry tests)
        # and the eval extras (pyyaml, anthropic, openai construction).
        run: pip install -e ".[telemetry,eval]"
      - run: make test
      - name: Strict coverage on new code paths
        if: matrix.python-version == '3.12'
        run: make coverage-strict
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage

  eval-smoke:
    # Deterministic ground-truth gate: scores BAMCP tools against the
    # synthetic_v1 truth set (no LLM, no network). Fails on any regression in
    # variant detection, false-positive control, or artifact-type recall.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: pip install -e ".[eval]"
      - name: Generate deterministic fixtures
        run: python tests/create_fixtures.py
      - name: Score ground-truth truth set
        run: make eval-smoke

  frontend:
    # Static checks + unit tests for the viewer TS — a layer the frontend never had.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bamcp/static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/bamcp/static/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: make install
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests/e2e/ -v --no-cov
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile prod build
      - run: docker compose --profile dev build
