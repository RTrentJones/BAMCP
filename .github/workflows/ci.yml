name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reproducible-build gate: the lockfile must be fresh, and the PINNED environment must
  # install and pass the ship-gate (test + eval-smoke). The 3.10-3.12 `test` matrix below
  # deliberately installs broad ranges — that is the compat check; this is the pinned one.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Install from the frozen lock
        run: uv sync --frozen --extra dev --extra eval --extra telemetry
      # The bundled viewer is part of the ship-gate (test_resources asserts the built bundle),
      # so build it here just as `make install` does for the other jobs.
      - name: Build the viewer bundle
        run: make build-viewer
      - name: Deterministic fixtures + ship-gate from the pinned env
        run: |
          uv run python tests/create_fixtures.py
          uv run python -m pytest tests/ --ignore=tests/e2e -q
          uv run make eval-smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: make lint
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - name: Install telemetry + eval extras
        # The 85% strict coverage gate needs the OTel SDK (telemetry tests)
        # and the eval extras (pyyaml, anthropic, openai construction).
        run: pip install -e ".[telemetry,eval]"
      - run: make test
      - name: Strict coverage on new code paths
        if: matrix.python-version == '3.12'
        run: make coverage-strict
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: .coverage

  eval-smoke:
    # Deterministic ground-truth gate: scores BAMCP tools against the
    # synthetic_v1 truth set (no LLM, no network). Fails on any regression in
    # variant detection, false-positive control, or artifact-type recall.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: pip install -e ".[eval]"
      - name: Generate deterministic fixtures
        run: python tests/create_fixtures.py
      - name: Score ground-truth truth set
        run: make eval-smoke
      # Per-commit trend on main: re-score as JSON and publish to Tracer
      # (tracer.rtrentjones.dev/projects/bamcp). Runs even when the gate above failed, so a
      # regression lands on the dashboard too. Best-effort: inert without TRACER_INGEST_TOKEN,
      # and never fails the job (the gate above owns pass/fail).
      - name: Publish ground truth to Tracer (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TRACER_INGEST_TOKEN: ${{ secrets.TRACER_INGEST_TOKEN }}
        run: |
          if [ -z "$TRACER_INGEST_TOKEN" ]; then
            echo "TRACER_INGEST_TOKEN unset — skipping"
            echo "⚠️ Tracer publish skipped: TRACER_INGEST_TOKEN unset" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m bamcp.eval.truthset --manifest tests/eval/datasets/synthetic_v1/manifest.yaml \
            --json > truthset-synthetic.json || true
          python -m bamcp.eval.truthset --manifest tests/eval/datasets/indel_v1/manifest.yaml \
            --min-precision 1.0 --json > truthset-indel.json || true
          python -m bamcp.eval.tracer truthset truthset-synthetic.json truthset-indel.json --env ci --post
      # Visual-vs-text eval dry run: fixtures + stimuli + leak-lint + grader self-tests.
      # No Chromium in this job, so the PNG (V) conditions are skipped with a message.
      - name: Visual eval dry run (hermetic)
        run: make eval-visual-dry

  frontend:
    # Static checks + unit tests for the viewer TS — a layer the frontend never had.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bamcp/static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/bamcp/static/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: make install
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests/e2e/ -v --no-cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-screenshots
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile prod build
      - run: docker compose --profile dev build
