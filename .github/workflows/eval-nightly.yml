name: Eval (nightly)

# The deterministic ground-truth gate runs on every PR (ci.yml::eval-smoke).
# This workflow adds the parts that are too slow or too costly for a PR gate:
# a nightly re-run of the gate, plus an optional LLM-driven eval that only runs
# when an API key is configured. Results are uploaded as artifacts so the
# numbers can be tracked over time.

on:
  schedule:
    - cron: "0 7 * * *" # daily, after the security weekly window
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider for the optional model run"
        default: "anthropic"
        type: choice
        options: [anthropic, openai, mock]

permissions:
  contents: read

jobs:
  ground-truth:
    # Deterministic, no secrets — always runs and always gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: pip install -e ".[eval]"
      - run: python tests/create_fixtures.py
      - name: Score SNV synthetic truth set (JSON)
        run: |
          python -m bamcp.eval.truthset \
            --manifest tests/eval/datasets/synthetic_v1/manifest.yaml --json \
            | tee truthset-synthetic-report.json
      - name: Score indel truth set (JSON)
        run: |
          python -m bamcp.eval.truthset \
            --manifest tests/eval/datasets/indel_v1/manifest.yaml --min-precision 1.0 --json \
            | tee truthset-indel-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: truthset-report
          path: |
            truthset-synthetic-report.json
            truthset-indel-report.json

  llm-eval:
    # Optional: only runs when ANTHROPIC_API_KEY is present in repo secrets, so
    # forks and key-less setups skip it instead of failing. A skip is never silent:
    # it emits a ::warning:: annotation and an "LLM eval SKIPPED" step summary.
    runs-on: ubuntu-latest
    needs: [ground-truth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check the selected provider is runnable
        id: key
        env:
          PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          reason=""
          case "$PROVIDER" in
            mock) available=true ;;
            openai)
              # NOT yet runnable: the shared runner records follow-up turns in Anthropic message
              # shape (tool_use / tool_result blocks), which OpenAIProvider forwards verbatim to
              # chat.completions — so any tool-calling case fails. Real parity needs provider-
              # specific message translation in the runner (deferred, Phase 3b). Skip rather than
              # advertise a broken path.
              available=false
              reason="provider 'openai' is gated until the runner does provider-specific message translation (Phase 3b)"
              ;;
            *)
              if [ -n "$ANTHROPIC_API_KEY" ]; then
                available=true
              else
                available=false
                reason="ANTHROPIC_API_KEY secret is not configured for this repository"
              fi
              ;;
          esac
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != "true" ]; then
            # Surface the skip: a silently-skipped LLM job used to look like a green eval.
            echo "::warning title=LLM eval skipped::LLM eval SKIPPED: $reason. Only the deterministic ground-truth gate ran."
            {
              echo "## LLM eval SKIPPED"
              echo ""
              echo "**Reason:** $reason (provider: \`$PROVIDER\`)."
              echo ""
              echo "Only the deterministic ground-truth gate ran; no model was evaluated in this run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.key.outputs.available == 'true'
        run: make install && pip install -e ".[eval]"
      - if: steps.key.outputs.available == 'true'
        run: python tests/create_fixtures.py
      - name: Run LLM eval harness
        if: steps.key.outputs.available == 'true'
        env:
          # Only the Anthropic (and mock) paths reach here; OpenAI is gated above until the
          # runner supports its message shape.
          PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # mock has no tool calls, so a full run fails the tools_expected cases. Use it as a
          # secretless schema/parse smoke check (--dry-run) instead of a scoring run.
          extra=""
          [ "$PROVIDER" = "mock" ] && extra="--dry-run"
          python scripts/run_eval.py --provider "$PROVIDER" --output-dir .eval-results $extra
      - name: Model comparison + tool-use ablation
        # Skip mock (no tool calls → tool-use cases can't be compared); OpenAI is already gated off.
        if: steps.key.outputs.available == 'true' && github.event.inputs.provider != 'mock'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_comparison.py \
            --provider "${{ github.event.inputs.provider || 'anthropic' }}" \
            --output-dir .eval-results/comparison
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.available == 'true'
        with:
          name: eval-results
          path: .eval-results/
