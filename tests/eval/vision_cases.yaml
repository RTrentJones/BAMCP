# BAMCP vision benchmark cases. These cases are designed so the answer is
# only obtainable by inspecting the rendered viewer image — text summaries
# alone aren't enough. Every case sets `vision_required: true` so non-vision
# runs skip them cleanly (with a "skipped: vision unavailable" verdict).
#
# Each case runs once per `rendering_modes` entry when `--with-rendering-
# comparison` is set, producing a per-mode pass/fail in the report.
#
# Conventions (enforced by tests/unit/eval/test_vision_paths.py):
# - Positions are 1-based, samtools-style, like every region at the tool boundary.
#   The comprehensive fixture's Group D sites are chr1:1051 (A>T, 8 forward-only alt
#   reads), chr1:1101 (A>C, read-start position bias), chr1:1151 (A>G, 10 alt reads,
#   5 forward / 5 reverse) and chr1:1201 (A>T, mostly low-MAPQ alt reads).
# - `input` never states the answer: no alleles ("A>T"), no marker-colour decoding
#   ("orange=G"), no counts ("~8 alt reads"). The truth lives only in `expected`,
#   which the grader sees and the model under test does not.

- case:
    name: "Count alt-supporting reads at a site"
    category: "Vision: count"
    input: |
      Visualize chr1:1000-1100 in tests/fixtures/comprehensive.bam using
      reference tests/fixtures/comprehensive_ref.fa. Look at the rendered
      image at chr1:1051. Which non-reference base do some reads carry there,
      and roughly how many reads carry it out of the reads covering the site?
      Report the base and a count.
    expected: |
      chr1:1051 is A>T. The model names T as the non-reference base and reports
      a count close to 8 alt-supporting reads (of roughly 20 covering reads).
      A count within 6-10 is acceptable; a vague "several reads" is not.
    tools_expected: ["visualize_region"]
    bam_fixture: "tests/fixtures/comprehensive.bam"
    rendering_modes: ["expanded", "dv-strips", "dv-composite"]
    vision_required: true

- case:
    name: "Identify the alt allele at a site"
    category: "Vision: identify"
    input: |
      Visualize chr1:1100-1200 in tests/fixtures/comprehensive.bam (reference
      tests/fixtures/comprehensive_ref.fa). From the rendered image, what is
      the reference base and the alternate base at chr1:1151? Answer with
      one of A/C/G/T for each.
    expected: |
      chr1:1151 is A>G: reference A, alternate G. The model must name G as the
      alternate base; naming a different base or no specific base fails.
    tools_expected: ["visualize_region"]
    bam_fixture: "tests/fixtures/comprehensive.bam"
    rendering_modes: ["expanded", "dv-strips"]
    vision_required: true

- case:
    name: "Strand balance at variant"
    category: "Vision: strand"
    input: |
      Visualize chr1:1000-1100 in tests/fixtures/comprehensive.bam (reference
      tests/fixtures/comprehensive_ref.fa). Looking at the rendered reads,
      are the reads that carry a non-reference base at chr1:1051 spread
      across both the forward and reverse strands, or do they cluster on one
      strand? Name the strand(s).
    expected: |
      Every alt-supporting read at chr1:1051 is on the forward strand (8 forward,
      0 reverse) while reference reads come from both strands — a strand-bias
      pattern. The model must say the alt reads cluster on the forward strand.
    tools_expected: ["visualize_region"]
    bam_fixture: "tests/fixtures/comprehensive.bam"
    rendering_modes: ["expanded", "dv-strips"]
    vision_required: true

- case:
    name: "Coverage uniformity"
    category: "Vision: coverage"
    input: |
      Visualize chr1:1000-2000 in tests/fixtures/comprehensive.bam (reference
      tests/fixtures/comprehensive_ref.fa). Looking at the coverage track at
      the top of the viewer, is coverage uniform across the region, or are
      there obvious dropouts? Describe the pattern in one sentence.
    expected: |
      Coverage is not uniform: reads pile up between roughly chr1:1000 and
      chr1:1300 and over the homopolymer near chr1:1800, with little or no
      coverage elsewhere in the window. A correct answer notes the variation
      and dropouts rather than asserting flat uniformity.
    tools_expected: ["visualize_region"]
    bam_fixture: "tests/fixtures/comprehensive.bam"
    rendering_modes: ["expanded", "dv-composite"]
    vision_required: true

- case:
    name: "Compare base qualities across reads (dv-strips)"
    category: "Vision: quality"
    input: |
      Visualize chr1:1000-1100 in tests/fixtures/comprehensive.bam (reference
      tests/fixtures/comprehensive_ref.fa). The dv-strips rendering shows a
      base-quality channel as one of the strips on each read. Looking at this
      channel, are base qualities roughly uniform across reads, or do some
      reads stand out with markedly lower qualities?
    expected: |
      Base qualities are uniform: every read in this fixture region carries
      Q40 at every base, so no read stands out. Claiming low-quality outlier
      reads fails.
    tools_expected: ["visualize_region"]
    bam_fixture: "tests/fixtures/comprehensive.bam"
    rendering_modes: ["dv-strips"]
    vision_required: true

- case:
    name: "Identify highest-VAF variant in panel"
    category: "Vision: panel"
    input: |
      Visualize chr1:1000-2000 in tests/fixtures/comprehensive.bam (reference
      tests/fixtures/comprehensive_ref.fa). The variants panel at the bottom
      of the viewer lists detected variants with their VAFs. Which variant
      has the highest VAF? Report 'chrom:pos ref>alt' and the VAF.
    expected: |
      The model reads off the highest-VAF row from the variant panel and
      reports its 1-based position, ref/alt alleles, and numeric VAF exactly
      as the panel shows them.
    tools_expected: ["visualize_region"]
    bam_fixture: "tests/fixtures/comprehensive.bam"
    rendering_modes: ["expanded"]
    vision_required: true
